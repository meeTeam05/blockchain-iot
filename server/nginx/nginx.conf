worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    sendfile   on;
    gzip       on;
    keepalive_timeout 65;
    client_max_body_size 1m;
    limit_req_status 429;

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;

    # Docker internal DNS required for upstream hostname resolution
    resolver 127.0.0.11 valid=30s ipv6=off;

    # HTTPS OTA firmware file server
    # Public clients terminate at the edge and reach nginx over the existing
    # ingress path; firmware verifies the public certificate chain, not this
    # internal self-signed reuse detail.
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # OTA firmware binaries. Put files in server/ota-files/ on the Pi.
        location /ota/ {
            client_max_body_size 16m;
            root /var/www;
            autoindex off;
            add_header Content-Type application/octet-stream;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Task 5 dApp (web3/dist built static files, deployed to server/dapp-files/).
        # try_files falls back to index.html so client-side routes like
        # /dapp/d/:deviceId/i/:incidentId don't 404 on a direct/refreshed load.
        location /dapp/ {
            root /var/www;
            autoindex off;
            try_files $uri $uri/ /dapp/index.html;
        }

        # Health check
        location = /nginx/health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx-https"}';
            add_header Content-Type application/json;
        }
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # API realtime stream (Server-Sent Events)
        location = /api/realtime {
            set $upstream http://api:3000;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            gzip               off;
        }

        # API
        location ^~ /api/auth/ {
            limit_req zone=auth_per_ip;
            set $upstream http://api:3000;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api_per_ip burst=60 nodelay;
            set $upstream http://api:3000;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # MQTT over WebSocket
        location /mqtt {
            set $upstream http://emqx:8083;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "Upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # OTA firmware binaries accessible via domain (Cloudflare provides HTTPS)
        location /ota/ {
            client_max_body_size 16m;
            root /var/www;
            autoindex off;
            add_header Content-Type application/octet-stream;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Task 5 dApp (web3/dist built static files, deployed to server/dapp-files/).
        # try_files falls back to index.html so client-side routes like
        # /dapp/d/:deviceId/i/:incidentId don't 404 on a direct/refreshed load.
        location /dapp/ {
            root /var/www;
            autoindex off;
            try_files $uri $uri/ /dapp/index.html;
        }

        # Nginx self-health
        location = /nginx/health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }
    }
}
